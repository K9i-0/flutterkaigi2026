<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福ちゃん 顔の奥行き比較</title>
<style>body{font:15px system-ui;background:#ece9e2;color:#26362e;margin:24px}h1{font-size:23px;margin-bottom:6px}p{margin-top:0;color:#526056}nav{display:flex;gap:8px;margin:18px 0}button{padding:9px 16px;border:1px solid #86978b;border-radius:8px;background:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#fff;border-radius:12px;overflow:hidden}h2{font-size:15px;padding:0 14px}.view{aspect-ratio:1;position:relative;background:#eee9dd}.view canvas{width:100%;height:100%;display:block}.reference{background:url('./front.png') no-repeat;background-size:462.222% 615.556%;background-position:49.693% 2.155%}small{display:block;padding:12px;color:#68766d}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}</style>
<h1>福ちゃん — 顔の奥行き比較</h1><p>公式サイトと同じ照明で比較。輪郭・パーツ位置は共通。浅い形状と、陰影を抑えた材質の効果を確認。</p>
<nav><button data-angle="0">正面</button><button data-angle="30">斜め</button><button data-angle="90">横顔</button><button id="material">テクスチャあり</button></nav>
<div class="grid"><article><h2>入力 front</h2><div class="view reference"></div><small>目標の顔・表情</small></article><article><h2>調整前</h2><div class="view" id="baseline"></div><small>髪テクスチャ修正版</small></article><article><h2>形状を浅く</h2><div class="view" id="shallow"></div><small>凹凸を42%弱める設定</small></article><article><h2>浅い形状＋陰影を調整</h2><div class="view" id="balanced"></div><small>材質の照明応答も抑えた候補</small></article></div><p id="status">モデル読み込み中…</p>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const entries=[];let angle=0,plain=false;
for(const name of ['baseline','shallow','balanced']){
 const host=document.getElementById(name),scene=new THREE.Scene();scene.background=new THREE.Color('#eee9dd');
 const camera=new THREE.OrthographicCamera(-.15254,.15254,.15254,-.15254,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xfffaf0,0x898b75,2.6));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(3,5,4);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.4);fill.position.set(-3,2,-3);scene.add(fill);
 const entry={scene,camera,renderer,host,materials:[]};entries.push(entry);
 try{const gltf=await new GLTFLoader().loadAsync('./'+name+'.glb?v=shallow-3');scene.add(gltf.scene);gltf.scene.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])entry.materials.push([m,m.map,m.color.clone(),m.emissiveMap,m.emissive.clone()]);});}catch(e){document.getElementById('status').textContent=String(e);throw e;}
}
function render(){for(const e of entries){const size=e.host.clientWidth;e.renderer.setSize(size,size,false);const target=new THREE.Vector3(.0050847,1.5550847,0);e.camera.position.copy(target).add(new THREE.Vector3(Math.sin(angle)*5,0,Math.cos(angle)*5));e.camera.lookAt(target);e.renderer.render(e.scene,e.camera);}}
for(const b of document.querySelectorAll('[data-angle]'))b.onclick=()=>{angle=Number(b.dataset.angle)*Math.PI/180;render();};document.getElementById('material').onclick=()=>{plain=!plain;for(const e of entries)for(const [m,map,color,emissiveMap,emissive]of e.materials){m.map=plain?null:map;m.emissiveMap=plain?null:emissiveMap;m.emissive.copy(plain?new THREE.Color(0,0,0):emissive);m.color.copy(plain?new THREE.Color(.55,.55,.55):color);m.needsUpdate=true;}document.getElementById('material').textContent=plain?'形状のみ':'テクスチャあり';render();};window.onresize=render;render();document.getElementById('status').textContent='3モデル読み込み完了。ボタンで同じ角度へ切り替えできます。';
</script></html>
