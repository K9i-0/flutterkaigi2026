<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福ちゃん — 首修正・モーション</title>
<style>body{margin:20px;background:#edeae3;color:#283b30;font:15px system-ui}h1{font-size:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,select{font:inherit;padding:8px;border:1px solid #a3aba4;border-radius:8px;background:white}main{display:grid;grid-template-columns:1fr 250px;gap:16px}#view{height:75vh;background:#eee9dd;min-height:480px}canvas{width:100%;height:100%}aside img{width:100%;max-height:65vh;object-fit:contain}input[type=range]{width:300px}small{display:block;margin:8px 0}@media(max-width:700px){main{grid-template-columns:1fr}aside{max-width:220px}}</style>
<h1>福ちゃん — 首修正・モーション</h1><nav><label>動作 <select id="motion"></select></label><button id="play">一時停止</button><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">背面</button><button data-view="neck">首を拡大</button><button id="bones">骨格を表示</button></nav>
<nav><label>時刻 <input id="time" type="range" min="0" max="1" step="0.01" value="0"></label><span id="clock"></span></nav><main><div id="view"></div><aside><img src="gyungyun_pose.png" alt="ギュンギュンポーズの参照写真"><small>両こぶしを頬の横へ。右膝を上げ、左足で支える。</small></aside></main><p id="status">読み込み中…</p>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const host=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#eee9dd');const camera=new T.PerspectiveCamera(35,1,.01,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.85,0);camera.position.set(0,.95,3.4);controls.update();scene.add(new T.HemisphereLight(0xfffaf0,0x898b75,2.6));for(const [pos,power]of [[[3,5,4],3.2],[[-3,2,-3],1.4]]){const l=new T.DirectionalLight(0xffffff,power);l.position.set(...pos);scene.add(l);}const floor=new T.Mesh(new T.CircleGeometry(1,64),new T.MeshStandardMaterial({color:0xd3d5cb,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
const gltf=await new GLTFLoader().loadAsync('./fukuchan.glb?v=rig3');scene.add(gltf.scene);const mixer=new T.AnimationMixer(gltf.scene),skeleton=new T.SkeletonHelper(gltf.scene);skeleton.visible=false;scene.add(skeleton);let action,paused=false;const select=document.querySelector('#motion'),slider=document.querySelector('#time');const labels={Idle:'待機',Walk:'歩く',Run:'走る',Greeting:'ごあいさつ',GyunGyun:'ギュンギュン',GyunGyunPose:'ギュンギュン・ポーズ保持',DanceStep:'ダンス',DanceDisco:'ディスコ'};
for(const clip of gltf.animations){const opt=document.createElement('option');opt.value=clip.name;opt.textContent=labels[clip.name]||clip.name;select.append(opt);}
function setMotion(){mixer.stopAllAction();const clip=gltf.animations.find(c=>c.name===select.value);action=mixer.clipAction(clip).reset().play();slider.max=clip.duration;mixer.update(0);}select.value='GyunGyunPose';setMotion();select.onchange=setMotion;document.querySelector('#play').onclick=()=>{paused=!paused;document.querySelector('#play').textContent=paused?'再生':'一時停止';};slider.oninput=()=>{paused=true;document.querySelector('#play').textContent='再生';action.time=Number(slider.value);mixer.update(0);};document.querySelector('#bones').onclick=()=>{skeleton.visible=!skeleton.visible;};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{const v=b.dataset.view;if(v==='neck'){controls.target.set(0,1.42,0);camera.position.set(-.65,1.43,0);}else{controls.target.set(0,.85,0);camera.position.set(v==='side'?3.4:0,.95,v==='front'?3.4:v==='back'?-3.4:0);}controls.update();};
function resize(){renderer.setSize(host.clientWidth,host.clientHeight,false);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();}window.onresize=resize;resize();let last=performance.now();function tick(now){requestAnimationFrame(tick);if(!paused)mixer.update(Math.min((now-last)/1000,.05));last=now;controls.update();slider.value=action.time;document.querySelector('#clock').textContent=action.time.toFixed(2)+' 秒';renderer.render(scene,camera);}requestAnimationFrame(tick);document.querySelector('#status').textContent=gltf.animations.length+'動作を読み込みました。ドラッグで回転、ホイールで拡大できます。';
</script></html>
