name: sobaya_ippai
description: Tilt, pour and stop. A Flutter Scene beer mini game.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_scene:
    git:
      url: https://github.com/K9i-0/flutter_scene.git
      ref: 2606511163ea1144b096f3a7d16b8b85ee0dbc2e
      path: packages/flutter_scene
  madogiwa_engine:
    path: ../../packages/madogiwa_engine
  vector_math: ^2.4.2
  audioplayers: ^6.8.1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.3
  marionette_flutter: ^0.6.0
  hooks: ^2.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/materials/
    - assets/audio/
    - assets/models/
    - flutter_scene_generated/
