name: madogiwa_island_craft
description: A voxel island survival and building game made with Flutter Scene.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_scene: ^0.22.2
  hooks: ^2.0.2
  vector_math: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
    # Relative symlink to canonical GLBs. Never copy or edit them here.
    - assets/models/
