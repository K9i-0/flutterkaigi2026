name: sobaya_hazard
description: A rebuilt stealth shooter powered by Madogiwa Engine.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  madogiwa_engine:
    path: ../packages/madogiwa_engine
  flutter_scene:
    git:
      url: https://github.com/K9i-0/flutter_scene.git
      ref: 793471301610dd413756b963c52b58d5dea63b68
      path: packages/flutter_scene
  vector_math: ^2.4.2
  marionette_flutter: ^0.6.0
  hooks: ^2.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/yard.json
    - assets/models/
    - flutter_scene_generated/
