name: sobaya_hazard_lab
description: "Sobaya Hazard model, movement, collision and rendering validation lab."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.23.0
  hooks: ^2.0.2
  marionette_flutter: ^0.6.0
  vector_math: ^2.4.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - assets/farm.json
    - assets/mountain.json
    - assets/village.json
    - assets/collection/
    - assets/cinematics/
    - assets/audio/
    - assets/audio/voice/
    - assets/audio/soundscape/
    - assets/audio/combat/
  uses-material-design: true
