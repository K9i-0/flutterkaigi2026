# Project-local Flutter runtime automation, aligned with ccpocket.

[mcp_servers.marionette]
command = "mise"
args = [
  "exec",
  "flutter@3.47.2",
  "--",
  "dart",
  "pub",
  "global",
  "run",
  "marionette_mcp:marionette_mcp",
]
enabled_tools = [
  "connect",
  "disconnect",
  "get_interactive_elements",
  "get_logs",
  "scroll_to",
  "tap",
  "double_tap",
  "long_press",
  "enter_text",
  "swipe",
  "pinch_zoom",
  "press_back_button",
  "press_key",
  "take_screenshots",
  "list_custom_extensions",
  "call_custom_extension",
]

[mcp_servers.dart-mcp]
command = "mise"
args = ["exec", "flutter@3.47.2", "--", "dart", "mcp-server", "--enable=flutter_app_lifecycle"]
env = {}
enabled_tools = [
  "launch_app",
  "stop_app",
  "get_app_logs",
  "list_running_apps",
  "dtd",
  "hot_reload",
  "hot_restart",
  "widget_inspector",
  "roots",
  "list_devices",
  "get_runtime_errors",
]
