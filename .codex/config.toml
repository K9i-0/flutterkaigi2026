# Project-local Flutter runtime automation, aligned with ccpocket.

[mcp_servers.marionette]
command = "marionette_mcp"
args = []
enabled_tools = [
  "connect",
  "disconnect",
  "get_interactive_elements",
  "get_logs",
  "scroll_to",
  "tap",
  "double_tap",
  "long_press",
  "enter_text",
  "swipe",
  "pinch_zoom",
  "press_back_button",
  "take_screenshots",
  "list_custom_extensions",
  "call_custom_extension",
]

[mcp_servers.dart-mcp]
command = "dart"
args = ["mcp-server"]
env = {}
enabled_tools = [
  "launch_app",
  "stop_app",
  "get_app_logs",
  "list_running_apps",
  "connect_dart_tooling_daemon",
  "hot_reload",
  "hot_restart",
  "get_widget_tree",
  "get_runtime_errors",
]

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"
auth = "oauth"
default_tools_approval_mode = "writes"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare-bindings]
url = "https://bindings.mcp.cloudflare.com/mcp"
auth = "oauth"
default_tools_approval_mode = "writes"

[mcp_servers.cloudflare-builds]
url = "https://builds.mcp.cloudflare.com/mcp"
auth = "oauth"
default_tools_approval_mode = "writes"

[mcp_servers.cloudflare-observability]
url = "https://observability.mcp.cloudflare.com/mcp"
auth = "oauth"
default_tools_approval_mode = "writes"

[mcp_servers.madogiwa-studio]
url = "https://madogiwa-studio.madogiwa-studio.workers.dev/mcp"
auth = "oauth"
default_tools_approval_mode = "writes"
