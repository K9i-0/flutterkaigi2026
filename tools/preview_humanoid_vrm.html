<!doctype html><meta charset="utf-8"><title>そば屋・福ちゃん VRM 1.0 検証</title>
<style>body{margin:0;background:#18232d;color:white;font:18px sans-serif}header{padding:20px;position:absolute}button{padding:10px;margin:8px}#status{font-size:14px}canvas{display:block}</style>
<header>そば屋・福ちゃん — VRM 1.0<br><button id="pose">腕の動作を確認</button><button id="mouth">福ちゃんの口パク</button><div id="status">読み込み中</div></header>
<script type="importmap">{"imports":{"three":"/.local/vrm-validation/node_modules/three/build/three.module.js","three/addons/":"/.local/vrm-validation/node_modules/three/examples/jsm/","@pixiv/three-vrm":"/.local/vrm-validation/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {VRMLoaderPlugin} from '@pixiv/three-vrm';
const scene=new THREE.Scene();scene.background=new THREE.Color('#405364');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.4,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x808080,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(2,4,4);scene.add(sun);scene.add(new THREE.GridHelper(10,20));const avatars=[];
try{for(const [i,name] of ['sobaya','fukuchan'].entries()){const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));const asset=await loader.loadAsync('/04_GAME_ASSETS/vrm/characters/'+name+'.vrm');const vrm=asset.userData.vrm;vrm.scene.position.x=i?-.65:.65;scene.add(vrm.scene);avatars.push(vrm);}document.querySelector('#status').textContent='VRM 1.0：2体のロード成功 / テクスチャ・人型ボーン・口パク';window.vrmReady=true;}catch(e){document.querySelector('#status').textContent=e.stack;throw e;}
let pose=false,mouth=false;document.querySelector('#pose').onclick=()=>pose=!pose;document.querySelector('#mouth').onclick=()=>mouth=!mouth;
renderer.setAnimationLoop(t=>{for(const v of avatars){for(const side of ['left','right'])v.humanoid.getNormalizedBoneNode(side+'LowerArm').rotation.x=pose?Math.sin(t/500)*.35:0;v.expressionManager?.setValue('aa',mouth?(1+Math.sin(t/150))*.4:0);v.update(1/60);}renderer.render(scene,camera);});
</script>
