<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>そば屋ハザード 軽量化比較</title>
<style>
body{margin:0;background:#20252b;color:#eee;font:15px system-ui}header{padding:18px 24px}h1{font-size:22px;margin:0 0 12px}button,select,input{font:inherit;margin-right:12px;padding:6px}main{display:flex}section{width:50%;text-align:center}canvas{width:100%;display:block}#status{padding:15px;font-size:13px}label{margin-right:14px}
</style>
<header><h1>そば屋ハザード · 元モデルと軽量版</h1>
<select id="character"><option value="sobaya">そば屋</option><option value="fukuchan">福ちゃん</option><option value="yametaro">やめ太郎</option><option value="takosan">たこさん</option></select>
<select id="motion"></select><button id="play">再生</button><label>秒 <input id="time" type="number" min="0" max="10" step="0.1" value="0.5" style="width:65px"></label>
<button data-angle="0">正面</button><button data-angle="1.5707963267948966">側面</button><button data-angle="3.141592653589793">背面</button>
<label><input id="face" type="checkbox" checked>顔アップ</label><button id="audit">動作を比較</button><button id="download">比較記録を保存</button></header>
<main><section><p>元モデル</p><div id="before"></div></section><section><p>軽量版</p><div id="after"></div></section></main><p id="status">読み込み中…</p>
<script type="importmap">{"imports":{"three":"/.local/vrm-validation/node_modules/three/build/three.module.js","three/addons/":"/.local/vrm-validation/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id), mobile=new URLSearchParams(location.search).get('profile')==='mobile';
const sources={sobaya:'hazard_adopted/optimized_20260919/sobaya.glb',fukuchan:'hazard_adopted/optimized_20260919/fukuchan.glb',yametaro:'characters/yametaro/rig_nose_v3/yametaro.glb',takosan:'characters/takosan/rig_sheet_v2/takosan.glb'};
const before={sobaya:'hazard_adopted/v3_20260917/sobaya.glb',fukuchan:'hazard_adopted/v3_preview_20260917/fukuchan.glb'};
if(!mobile){for(const o of [...$('character').options])if(!before[o.value])o.remove();}else{document.querySelector('h1').textContent='そば屋ハザード · 現行モデルとスマホ軽量版';}
const history=[];
let panels=[],angle=0,running=false,time=.5,last=performance.now(),generation=0;
function panel(id){
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(560,620);renderer.setPixelRatio(1);renderer.setClearColor(0x303840);renderer.toneMapping=THREE.ACESFilmicToneMapping;$(id).replaceChildren(renderer.domElement);
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x6c7480,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-2,3,4);scene.add(light);
 return {renderer,scene,camera:new THREE.PerspectiveCamera(32,560/620,.01,20)};
}
function camera(){const f=$('face').checked,c=$('character').value,y=f?({sobaya:1.64,fukuchan:1.55,yametaro:.98,takosan:1.1}[c]):.8,d=f?(['sobaya','fukuchan'].includes(c)?.8:1.4):3.8;for(const p of panels){p.camera.position.set(Math.sin(angle)*d,y,Math.cos(angle)*d);p.camera.lookAt(0,y,0);}}
function sample(){for(const p of panels){p.mixer?.setTime(time);p.scene.updateMatrixWorld(true);p.renderer.render(p.scene,p.camera);}}
function metrics(){$('time').value=String(Number(time.toFixed(3)));sample();const pixels=panels.map(p=>{const c=document.createElement('canvas');c.width=560;c.height=620;const ctx=c.getContext('2d');ctx.drawImage(p.renderer.domElement,0,0);return ctx.getImageData(0,0,560,620).data;});let changed=0,sum=0,max=0;for(let i=0;i<pixels[0].length;i+=4){let diff=0;for(let k=0;k<3;k++){const d=Math.abs(pixels[0][i+k]-pixels[1][i+k]);sum+=d;max=Math.max(max,d);diff=Math.max(diff,d);}if(diff>2)changed++;}const result={character:$('character').value,motion:$('motion').value,time,angle,face:$('face').checked,changedPixelsOver2:changed,totalPixels:560*620,meanAbsoluteRgbDifference:sum/(560*620*3),maximumChannelDifference:max,triangles:panels.map(p=>p.renderer.info.render.triangles)};history.push(result);$('status').textContent=JSON.stringify(result);return result;}
function motion(){for(const p of panels){p.mixer.stopAllAction();p.actor.scene.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.pose();});const clip=p.actor.animations.find(c=>c.name===$('motion').value);if(clip)p.mixer.clipAction(clip).reset().play();}sample();if(!running)metrics();}
async function load(){const ticket=++generation;running=false;$('play').textContent='再生';$('status').textContent='読み込み中…';for(const p of panels){p.actor?.scene.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of(Array.isArray(o.material)?o.material:[o.material])){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose();}}});p.renderer.dispose();}panels=[panel('before'),panel('after')];const who=$('character').value;const actors=await Promise.all([mobile?sources[who]:before[who],`hazard_adopted/${mobile?'mobile_20260919':'optimized_20260919'}/${who}.glb`].map(file=>new GLTFLoader().loadAsync('/04_GAME_ASSETS/3d/'+file)));if(ticket!==generation)return;actors.forEach((actor,i)=>{Object.assign(panels[i],{actor,mixer:new THREE.AnimationMixer(actor.scene)});panels[i].scene.add(actor.scene);});$('motion').replaceChildren(...actors[0].animations.map(c=>new Option(c.name,c.name)));$('motion').value=who==='sobaya'?'CharacterSheet_MugStand':'Idle';camera();motion();}
$('character').onchange=load;$('motion').onchange=motion;$('time').onchange=()=>{time=Number($('time').value);running=false;$('play').textContent='再生';metrics();};$('face').onchange=()=>{camera();metrics();};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);camera();metrics();});$('play').onclick=()=>{running=!running;$('play').textContent=running?'停止':'再生';if(!running)metrics();};
$('audit').onclick=async()=>{running=false;$('play').textContent='再生';const names=$('character').value==='sobaya'?['CharacterSheet_MugStand','Adopted_Library_Walk','Adopted_Candidate_Chase_Run','Hybrid_MugPunch','Greeting']:['Idle','Walk','Run','Talk','Wave','Greeting'];const rows=[];for(const name of names){if(![...$('motion').options].some(o=>o.value===name))continue;$('motion').value=name;for(const face of [false,true]){if(face&&name!=='Idle'&&name!=='CharacterSheet_MugStand')continue;$('face').checked=face;for(const view of [0,Math.PI/2,Math.PI]){angle=view;camera();for(const phase of [.25,.75]){time=panels[0].actor.animations.find(c=>c.name===name).duration*phase;motion();rows.push(history.at(-1));await new Promise(requestAnimationFrame);}}}}$('status').textContent=JSON.stringify({character:$('character').value,comparisons:rows.length,maxMeanRgbDifference:Math.max(...rows.map(r=>r.meanAbsoluteRgbDifference)),maxChangedFraction:Math.max(...rows.map(r=>r.changedPixelsOver2/r.totalPixels))});};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({profile:mobile?'mobile':'lossless',samples:history},null,2)],{type:'application/json'}));a.download='hazard-mobile-comparison.json';a.click();URL.revokeObjectURL(a.href);};
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;if(running){time+=dt;$('time').value=time.toFixed(2);sample();}requestAnimationFrame(loop);}requestAnimationFrame(loop);load().catch(e=>$('status').textContent=e.stack);
</script></html>
