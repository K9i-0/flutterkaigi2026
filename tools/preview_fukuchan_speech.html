<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福ちゃん・口パク確認</title>
<style>body{margin:0;background:#eeeae4;color:#29332e;font:16px system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:24px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}button{font:inherit;padding:9px 18px;border:1px solid #bac2b9;border-radius:8px;background:white;cursor:pointer}#view{height:66vh;min-height:420px;background:#e9e5df;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:100%}input{width:240px}audio{width:min(100%,500px)}p{line-height:1.6}#status{font-size:14px}</style>
<main><h1>福ちゃん・口パク確認</h1><p>歯なし・開口量60%・赤茶の口内。顔を固定して、口の動きを確認できます。</p><nav><button data-angle="0">正面</button><button data-angle="-0.5">左斜め</button><button data-angle="0.5">右斜め</button><button data-open="0">閉じる</button><button data-open="0.5">半開き</button><button data-open="1">開く</button></nav><div id="view"></div><nav><label>口の開き <input id="mouth" type="range" min="0" max="1" step="0.01" value="0"></label><output id="value">0%</output></nav><p id="caption"></p><audio id="voice" controls></audio><p id="status">読み込み中…</p></main>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#e9e5df');const camera=new T.PerspectiveCamera(30,1,.01,30),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;const host=$('view');host.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.53,0);function angle(a){camera.position.set(Math.sin(a)*.74,1.53,Math.cos(a)*.74);controls.update()}angle(0);scene.add(new T.HemisphereLight(0xfff8ee,0x989caa,2));for(const [p,i]of [[[-2,3,4],2],[[3,1,2],.7]]){const light=new T.DirectionalLight(0xffffff,i);light.position.set(...p);scene.add(light)}
try{const gltf=await new GLTFLoader().loadAsync('./fukuchan.glb?v=warm-small-2');scene.add(gltf.scene);const meshes=[];gltf.scene.traverse(o=>{if(o.morphTargetDictionary?.SpeechOpen!==undefined)meshes.push(o)});if(!meshes.length)throw Error('口パク形状がありません');const data=await(await fetch('./voice.json')).json();$('caption').textContent=data.text;$('voice').src='./voice.wav';function morph(v){for(const m of meshes){m.morphTargetInfluences[m.morphTargetDictionary.SpeechOpen]=v;m.morphTargetInfluences[m.morphTargetDictionary.SpeechNarrow]=v*(.12+.55*(1-v))}$('mouth').value=v;$('value').textContent=Math.round(v*100)+'%'}$('mouth').oninput=()=>{$('voice').pause();morph(+$('mouth').value)};for(const b of document.querySelectorAll('[data-open]'))b.onclick=()=>{$('voice').pause();morph(+b.dataset.open)};for(const b of document.querySelectorAll('[data-angle]'))b.onclick=()=>angle(+b.dataset.angle);$('voice').onpause=()=>morph(0);$('voice').onended=()=>morph(0);function resize(){renderer.setSize(host.clientWidth,host.clientHeight,false);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();function frame(){requestAnimationFrame(frame);if(!$('voice').paused){const x=$('voice').currentTime*data.hz,i=Math.floor(x),a=data.open[i]??0,b=data.open[i+1]??0;morph(a+(b-a)*(x-i))}controls.update();renderer.render(scene,camera)}frame();$('status').textContent='音声を再生すると、ゲームと同じ音声強度データで口が動きます。ドラッグで回転、ホイールで拡大。';}catch(e){$('status').textContent='読み込みエラー: '+e.message;throw e}
</script></html>
