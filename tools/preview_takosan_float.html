<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たこさん · 浮遊モーション</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101c29;color:#ecf4fa;font:14px system-ui}#stage{position:fixed;inset:0 0 0 320px}aside{position:absolute;top:24px;left:24px;width:290px;padding:20px;max-height:calc(100vh - 48px);overflow:auto;background:#122333ed;border:1px solid #345064;border-radius:20px}h1{font-size:23px;margin:5px 0 12px}p{color:#adc5d4;line-height:1.7}small{letter-spacing:2px;color:#7bdacb}label{display:block;margin:12px 0 6px}input[type=range]{width:100%;accent-color:#7bdacb}button,select{background:#233d50;color:white;border:1px solid #4b677a;border-radius:8px;padding:9px;margin:3px;cursor:pointer}select{width:100%;margin:0}.row{display:flex;flex-wrap:wrap}output{color:#7bdacb}footer{position:absolute;bottom:20px;right:24px;color:#bdd0dc;font-size:12px}#error{color:#ffb6a8}@media(max-width:650px){#stage{inset:52vh 0 0}aside{top:12px;left:12px;width:calc(100% - 24px);max-height:48vh;padding:15px}p{display:none}h1{font-size:19px}label{margin-top:10px}}</style>

<body><div id="stage"></div><aside><small>MADOGIWA MOTION LAB</small><h1>たこさんの浮遊</h1><p>ふわりと漂い、加速すると前傾。<br>6本の触手が遅れてついてくる。</p><select id="mode" aria-label="移動スタイル"><option value="float">浮遊 · ゆらゆら漂う</option><option value="swim">無重力スイム · 触手で漕ぐ</option></select><label for="pattern">足の触手 · 動きの候補</label><select id="pattern"><option value="sway">A · ゆらゆら — 6本が自由に揺れる</option><option value="wave">B · 波打つ — 順番にうねる</option><option value="pulse">C · 一斉に漕ぐ — クラゲのように</option><option value="alternate">D · 交互に漕ぐ — 3本ずつ交互</option><option value="curl" selected>E · 先端くるくる — 根元は穏やか</option></select><div id="patternNote" style="color:#adc5d4;font-size:12px;margin-top:8px"></div><label for="strength">触手の動きの大きさ <output id="strengthValue">1.0倍</output></label><input id="strength" type="range" min="0" max="1.5" step="0.1" value="1"><label><input id="isolate" type="checkbox"> 触手だけを見る（体の揺れを止める）</label><label for="speed">移動速度 <output id="speedValue"></output></label><input id="speed" type="range" min="0" max="3" step="0.01" value="1.2"><div class="row"><button data-speed="0">停止</button><button data-speed="1.2">ゆっくり</button><button data-speed="3">高速</button></div><label><input id="auto" type="checkbox"> 自動で加速・減速</label><label><input id="travel" type="checkbox"> 円を描いて移動</label><div class="row"><button id="pause">一時停止</button><button id="front">正面</button><button id="side">側面</button><button id="angle">斜め</button><button id="above">斜め上</button><button id="below">下から</button><button id="hood">フード拡大</button></div><label><input id="bones" type="checkbox"> 関節を表示</label><p id="status">モデル読込中…</p><div id="error"></div></aside><footer>ドラッグ：視点回転 ／ ホイール：拡大縮小</footer><script type="module" src="./preview_takosan_float.mjs?v=5"></script></body></html>
