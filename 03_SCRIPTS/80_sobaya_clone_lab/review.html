<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>そば屋ハザード｜音声修正比較</title><style>body{background:#081113;color:#e9f1ef;font-family:system-ui,sans-serif;margin:32px auto;max-width:1200px;padding:0 20px}h1{font-size:26px}h2{font-size:20px}p{color:#b4c7c3;line-height:1.7}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}video{width:100%;background:black;border:1px solid #385452}button,a{background:#183a35;color:#b5ffdf;border:1px solid #396b5c;border-radius:8px;padding:12px;cursor:pointer;display:inline-block;text-decoration:none;margin:4px 4px 4px 0}small{display:block;line-height:1.6;color:#93aaa4}@media(max-width:760px){main{grid-template-columns:1fr}}</style><h1>そば屋ハザード｜修正前後の比較</h1><p>今回の修正版：測定画面は左がやめ太郎、右が福ちゃん。やめ太郎の5,082を先に確定し、その後でたこさんが「五千」と話します。33秒版。</p><main><section><h2>今回の改善候補</h2><video id="after" controls preload="metadata" src="final_remotion_clone_lab_scan_order.mp4"></video><button onclick="cue('after',11.6,16.2)">測定順を確認</button><button onclick="cue('after',29.5,33)">タイトルコール</button><button onclick="cue('after',0,33)">全編再生</button><small>声の自然さ・つなぎ目・口の同期は試聴確認用です。ASR一致とPCM検証は済んでいます。</small></section><section><h2>前回版</h2><video id="before" controls preload="metadata" src="final_remotion_clone_lab_quiet_lab.mp4"></video><button onclick="cue('before',11.6,16.2)">前回の測定順</button><button onclick="cue('before',0,33)">全編再生</button><small>前回の33秒版。福ちゃんが左で先に測定される配置。</small></section></main><p>今回は測定画面の左右配置とカウントアップの順序を変更しました。序盤の顔変形と大型投影装置は元映像のままです。</p><script>const stops=new Map;function cue(id,start,end){document.querySelectorAll('video').forEach(v=>v.pause());let v=document.getElementById(id);v.currentTime=start;stops.set(v,end);v.play()}document.querySelectorAll('video').forEach(v=>{v.addEventListener('timeupdate',()=>{if(stops.has(v)&&v.currentTime>=stops.get(v)){v.pause();stops.delete(v)}});v.addEventListener('play',()=>document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()}))});</script></html>
