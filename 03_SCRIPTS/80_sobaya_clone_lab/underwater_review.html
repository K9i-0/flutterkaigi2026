<!doctype html><html lang="ja"><meta charset="utf-8"><title>水中音声 比較</title><style>body{background:#121719;color:#eee;font-family:system-ui;max-width:1100px;margin:32px auto;padding:20px}main{display:flex;gap:24px}section{flex:1}video{width:100%}p{line-height:1.7}@media(max-width:700px){main{display:block}}</style><h1>液体越しの音声：2案</h1><p>既存本編のやめ太郎の台詞と培養音を使用。音の質感の比較用で、生成映像との口のタイミングは未調整です。</p><main><section><h2>A：控えめ</h2><p>聞き取りやすさを残したこもり方。培養音も小さめ。</p><video controls src="remotion/out/underwater/underwater_mild.mp4"></video><audio controls src="remotion/out/underwater/underwater_mild.wav"></audio></section><section><h2>B：強め</h2><p>高音をさらに抑え、揺らぎと近い培養音を強調。</p><video controls src="remotion/out/underwater/underwater_strong.mp4"></video><audio controls src="remotion/out/underwater/underwater_strong.wav"></audio></section></main><script>document.querySelectorAll('video,audio').forEach(v=>v.onplay=()=>document.querySelectorAll('video,audio').forEach(o=>{if(o!==v)o.pause()}))</script></html>
