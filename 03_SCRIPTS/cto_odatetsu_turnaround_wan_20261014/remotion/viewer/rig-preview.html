<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTOおだてつ — リグの確認</title>
<style>
  * {box-sizing:border-box} body {margin:0;font:14px system-ui,sans-serif;color:#222;background:#e6e6e6}
  canvas {display:block;width:100vw;height:100vh}
  section {position:fixed;top:16px;left:16px;right:16px;max-width:440px;padding:14px 18px;
    background:#fffffff0;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 20px #0001}
  h1 {font-size:18px;margin:0 0 10px} .row {display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
  button,select {padding:7px 12px;font:inherit;border:1px solid #bbb;border-radius:6px;background:white}
  input[type=range] {flex:1;min-width:160px} #status {font-size:12px;color:#555} #time {font-variant-numeric:tabular-nums}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<canvas id="scene"></canvas>
<section>
  <h1>CTOおだてつ · リグの確認</h1>
  <div class="row"><select id="clip" aria-label="アニメーション" disabled></select><button id="play" disabled>再生</button>
    <label><input id="bones" type="checkbox"> 骨を表示</label><button id="reset">視点を戻す</button>
    <button id="validate" disabled>全動作のseek検証</button></div>
  <div class="row"><input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="フレーム" disabled><span id="time">0.00 s</span></div>
  <div id="status">モデルを読み込み中…</div>
  <details id="validation" hidden><summary>seek検証結果</summary><pre id="validation-result" style="white-space:pre-wrap;max-height:180px;overflow:auto"></pre></details>
</section>
<script type="module" src="./rig-viewer.js"></script>
</html>
