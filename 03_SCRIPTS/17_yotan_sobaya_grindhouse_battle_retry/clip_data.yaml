project: よーたん対そば屋・グラインドハウス殺陣リトライ
total_duration_seconds: 30.0
format: 3 clips x 10 seconds
aspect_ratio: 16:9
dialogue: none
style:
  target: 1970年代日本グラインドハウス剣戟映画の緊張と、現代実写スタント映画の重量感
  do_not_copy: 特定映画の人物、衣装、セット、構図、振付、台詞、音楽
  rhythm: 長い静止、突然の爆発、短い静止、再加速
  palette: 深い黒、琥珀、クリムゾン、東京夜景の冷たい青
  vfx: 実写物理。図解線、星形バースト、同心円、可視ビームなし

clips:
  - id: CLIP-A
    global_time: 0.0-10.0
    title: 静止からの横薙ぎとギター反撃
    start_frame: clip_a_start_production.png
    end_frame: clip_a_end_production.png
    action:
      - time: 0.0-1.2
        beat: 横長の静かな対峙。よーたん左、そば屋右。互いに動かない
      - time: 1.2-3.5
        beat: そば屋が一歩で距離を詰め、ジョッキを頭部高さへ横薙ぎ
      - time: 3.5-5.2
        beat: よーたんが床すれすれへダックし、ジョッキが髪の上を通過
      - time: 5.2-7.8
        beat: よーたんがネックを両手で持ち、回転の反動でギターボディを脇腹へ一撃
      - time: 7.8-10.0
        beat: そば屋が右へ滑り、両者が低い構えで止まる
    camera:
      - 静かな正面横長ワイド
      - 攻撃開始で一度だけ急な寄り
      - 横薙ぎに合わせた高速横移動
      - 接触前後0.2秒だけ安定
      - 接触後に短いカメラ反動
    state_out: 床にそば屋の短い滑走跡。人物、小道具、スピーカーは無傷

  - id: CLIP-B
    global_time: 10.0-20.0
    title: 床振動、空中受け流し、四方向音圧
    start_frame: clip_b_start_production.png
    end_frame: clip_b_end_production.png
    action:
      - time: 0.0-2.2
        beat: そば屋がジョッキ底を床へ垂直に叩きつける
      - time: 2.2-4.0
        beat: 床材のたわみと粉塵の波。よーたんが左の低いステージ段差を蹴る
      - time: 4.0-6.4
        beat: よーたんが空中でギターボディを振り下ろし、そば屋がジョッキ側面で右外へ受け流す
      - time: 6.4-7.8
        beat: よーたんが三点着地し、即座に通常演奏姿勢へ戻る
      - time: 7.8-10.0
        beat: 一度のパワーコード後、4基のスピーカーから不可視の音圧。そば屋の衣服と粉塵が右へ押される
    camera:
      - 床接触へ真上クラッシュズーム
      - 跳躍へ低角度クラッシュチルト
      - 空中接触を客席側120度以内で追う
      - ストラムを超短いクローズアップ
      - 音圧でワイドへ急後退
    vfx:
      - 床材の一瞬のたわみ
      - 接触点から走る微細な亀裂
      - 粉塵の実写的な波
      - スピーカーコーンの振幅
      - 空気屈折、衣服と髪の圧力反応
      - 赤い線、同心円、ビームは禁止
    state_out: 床の亀裂、靴跡、滑走跡が残る。そば屋は右端で踏みとどまる

  - id: CLIP-C
    global_time: 20.0-30.0
    title: 音圧突破、三手の攻防、最終衝突
    start_frame: clip_c_start_production.png
    end_frame: clip_c_end_production.png
    action:
      - time: 0.0-2.2
        beat: そば屋が粉塵と音圧を突破し、右から中央へ低く突進
      - time: 2.2-5.2
        beat: ジョッキ斜め振り下ろし→ギターボディ外周で防御→よーたんが柄を返してボディを横へ押し返す、の三手
      - time: 5.2-7.2
        beat: ジョッキ底とギターボディ補強縁が中央で噛み合い、無音に近い押し合い
      - time: 7.2-8.8
        beat: 同じ接触点から実写的な圧力が破裂。床粉塵、衣服、レンズ、カメラが反応
      - time: 8.8-10.0
        beat: よーたんは左、そば屋は右へ滑って分離し、強いシルエットで再び構える
    camera:
      - そば屋と同速の低い横移動
      - 三手は短いワイド、超短い接触クローズアップ、ワイドの三段編集
      - 押し合いで完全静止
      - 衝撃で90度以内の回り込みと急後退
      - 最後は左右対称の低角度ワイド
    vfx:
      - 接触部位の短い変形
      - 粉塵と微細破片
      - 1〜2フレームの露出変化
      - 短いレンズ振動
      - 星形バースト、光球、漫画線は禁止
    state_out: 未決着。よーたん左、そば屋右。全床損傷と4基のスピーカーを保持

validation:
  - 各クリップは正確に10秒
  - クリップ間の開始・終了状態が一致
  - よーたん左、そば屋右を基準に維持
  - ギター打撃はネックを両手で持ち、ボディだけを使う
  - 音圧は4基のスピーカーだけから発生
  - 図解矢印、赤い星、同心円、可視ビームを完成映像へ出さない
  - プランニング画像をSeedanceへアップロードしない
