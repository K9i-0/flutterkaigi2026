version: 8
purpose: Seedance制作で再利用する正本テンプレート

policy:
  creative_control: 人物同一性だけをハード条件とする。衣装、小道具、表情、ポーズ、性格、口調、役割、能力、ジャンル、結末、過去作との整合性、夢オチ、復活、再登場、パロディ・オマージュの参照度はユーザー指定に従い、基本シートや過去作から制約を追加しない
  basic_character_sheet: 03_SCRIPTS/00_TEMPLATES/characters/character_<name>_basic_sheet.png を再利用する
  liveaction_identity_sheet: 実写人物は横3パネルを基本にする。左は正面の首なし全身、中央は自然な後頭部と首を含む背面全身、右は上下2分割した大きな3/4顔アップ（口を閉じた無表情／正典の歯を見せた自然な笑顔）。正面に顔・頭・首・首栓を描かず、背面に頬・鼻・横顔を出さない。文字、詳細図、色見本、追加ポーズを省き、顔アップへ画素を集中する
  media_basic_variant: 実写化など媒体だけを変えた汎用形は character_<name>_<medium>_basic_sheet.png としてテンプレートに置き、エピソード固有の衣装・能力・背景を混ぜない
  episode_character_sheet: 巨大化、変身、専用装備、ロボット化、負傷、特定モニターなど、その回だけの形態は 03_SCRIPTS/<NN>_<slug>/ に実ファイルで置く
  episode_usage: 基本形を使う場合は、出演者分だけをテンプレート正本からエピソードフォルダへ同名の実ファイルとしてコピーする。画像生成AIへ直接アップロードできるようシンボリックリンクは使わない
  episode_snapshot: エピソードフォルダ内のコピーは生成ランの入力スナップショット。テンプレート更新を既存エピソードへ自動反映せず、必要な場合だけ明示的に再コピーする
  override: 同一人物に基本形とエピソード限定形がある場合、該当秒区間ではエピソード限定形を優先する
  immutability: 過去エピソード内のコピー画像をテンプレートとして直接更新しない
  default_generation: モデル、解像度、尺の明示指定がなければSeedance 2.0・480p・15秒を選ぶ。Seedance 2.5、別解像度、別尺、Long Video、編集、延長、始終端、複数キーフレームはユーザーが明示指定した場合だけ使う。15秒を超える内容は既定の15秒クリップへ分割する
  official_seedance_2_5: ユーザーがSeedance 2.5を明示指定した場合だけ、.claude/skills/seedance/references/official_seedance_2_5_guide.md の素材上限、専用記法、Long Video、編集、延長、キーフレーム規則に従う
  action_description: 格闘、追跡、破壊、複雑なカメラはscript.mdのシーン地理と秒区間ごとの詳細テキストを正本にする。始終端・複数キーフレーム等はユーザーが明示指定した場合だけ使う
  pacing_overlap: 会話、コメディ、登場、受け渡し、交換などはペースモードを選び、音声・主動作・副動作・カメラの4レーンへ分ける。完全直列にするのはハード依存だけとし、ソフト依存と並行可能イベントを同じ時間窓へ重ねる
  voice_consistency: 02_CHARACTERS/VOICE_CAST.mdの正典話者は、固定モデル・参照WAV・既定seedからIrodori-TTSボイスサンプルを生成し、@AudioとしてSeedanceへ添付する。生成クリップの埋め込み音声を最終音声の正本にし、サンプルWAVをタイムラインへ重ねない
  deliverable_split: 制作設計と監査はscript.md、Seedanceへ貼り付ける本文はプレーンテキストのprompt.txtへ分離する。複数生成はprompt_clip_<id>.txtとして1回の生成につき1ファイルを作り、script.mdへプロンプト全文を重複掲載しない
  cross_clip_design: 複数クリップをまたぐ固有の蓋、装備、傷、変形、小道具は共通の本番用参照画像を使い、各クリップで同じ素材番号と役割を維持する。普段は隠す意匠は中遠景で強調せず、指定した寄り画で初めて判読させる
  key_asset: 読ませる小道具・ロゴ・看板・画面は、imagegenで本番画質の1ファイル1アセットを作る

directories:
  characters: 各メンバーの人物同一性と通常形の参考を示す基本シート。人物同一性以外はユーザー指定で変更できる
  environments: 再利用可能な環境の建築、固定設備、家具、小道具、材質、照明、地理を固定する本番用正本
  prompt: エピソード用の制作設計書script.mdと、全選択してそのままSeedanceへ貼り付けるprompt.txtのひな形

media_styles:
  toy_diorama_3d:
    name_ja: 窓際トイジオラマ3D
    name_en: Madogiwa Toy Diorama 3D
    visual_definition: 丸く柔らかいトイフィギュア造形、マットな樹脂・布の手触り、わずかな手作り感、暖色の映画的照明による高品質スタイライズド3D
    style_reference: ../21_takosan_php_prompt_pun/clip1_start.png

environment_assets:
  window_side_area_toy_diorama_3d:
    file: environments/environment_window_side_area_toy_diorama_3d_production.png
    prompt: environments/source_prompts/environment_window_side_area_toy_diorama_3d_production.md
    source_frame: ../21_takosan_php_prompt_pun/clip1_start.png
    media_style: toy_diorama_3d
    use_for: 21準拠の窓際族エリア。段ボール机、ノートPC、椅子、窓と東京タワー、暖簾、提灯、ソファ、棚、植物、暖色の午後光を含む無人の環境正本
    excluded: たこさん、やめ太郎、および人物由来の影

character_sheets:
  sobaya:
    file: characters/character_sobaya_basic_sheet.png
    canon: 02_CHARACTERS/01_Sobaya.md
    invariant: 露出する顔、首、耳、腕、手の肌は全てニュートラルなグレー系で統一する。肌色や褐色へ変更しない
  takosan:
    file: characters/character_takosan_basic_sheet.png
    canon: 02_CHARACTERS/02_Takosan.md
    media_variants:
      toy_diorama_3d:
        file: characters/character_takosan_toy_diorama_3d_basic_sheet.png
        prompt: characters/source_prompts/character_takosan_toy_diorama_3d_basic_sheet.md
        identity_canon: ../21_takosan_php_prompt_pun/clip1_start.png
        precedence: この媒体バリアントでは21の完成フレームを最上位正典とし、02_CHARACTERS/Takosan.pngと旧基本シートの造形を適用しない
        use_for: 窓際トイジオラマ3D映像での通常形。21準拠の丸くコンパクトな比率、無地寄りの大きなフード、少数の太いローブ模様、裾直下へ重なる細めで自然にテーパーした触手を固定する。触手と吸盤は光沢・湿潤感を禁止し、マットな布製ぬいぐるみ／柔らかい粘土トイ質感にする
  tokun:
    file: characters/character_tokun_basic_sheet.png
    canon: 02_CHARACTERS/03_Tokun.md
    face_identity_canon: 02_CHARACTERS/Tokun.jpg
    sheet_layout: 正面の首なし全身／帽子と自然な後頭部を含む背面全身／無表情と笑顔の大きな3/4顔アップ
    default_presentation: 通常形シートではウクレレをストラップなしで正面の両手に持たせ、背面には楽器やストラップを描かない。エピソードではユーザー指定に従い変更できる
  yotan:
    file: characters/character_yotan_basic_sheet.png
    canon: 02_CHARACTERS/04_Yotan.md
    face_identity_canon: 02_CHARACTERS/Yotan.jpg
    sheet_layout: 正面の首なし全身／自然な金髪後頭部を含む背面全身／無表情と笑顔の大きな3/4顔アップ
  fukuchan:
    file: characters/character_fukuchan_basic_sheet.png
    canon: 02_CHARACTERS/05_Fukuchan.md
    face_identity_canon: 02_CHARACTERS/Fukuchan.jpg
    sheet_layout: 正面の首なし全身／自然な黒髪後頭部を含む背面全身／無表情と笑顔の大きな3/4顔アップ
  yametaro:
    file: characters/character_yametaro_basic_sheet.png
    canon: 02_CHARACTERS/06_Yametaro.md
    media_variants:
      liveaction:
        file: characters/character_yametaro_liveaction_basic_sheet.png
        prompt: characters/source_prompts/character_yametaro_liveaction_basic_sheet.md
        use_for: 実写映像での通常時。オフィスカジュアルの葉柄シャツで、武闘家・炎上案拳の要素は含まない
      toy_diorama_3d:
        file: characters/character_yametaro_toy_diorama_3d_basic_sheet.png
        prompt: characters/source_prompts/character_yametaro_toy_diorama_3d_basic_sheet.md
        use_for: 窓際トイジオラマ3D映像での通常形。大きな黒髪、三角形の生え際、丸メガネ、ピンクの丸頬、薄紫の葉柄シャツを固定する
  okayaman:
    file: characters/character_okayaman_basic_sheet.png
    prompt: characters/source_prompts/character_okayaman_basic_sheet.md
    canon: 02_CHARACTERS/07_Okayaman.md
    default_presentation: 通常形シートは画面越しのリモート出演。エピソードではユーザー指定により現地出演、別形態、別役割へ変更できる
  yumemin:
    file: characters/character_yumemin_basic_sheet.png
    prompt: characters/source_prompts/character_yumemin_basic_sheet.md
    canon: 02_CHARACTERS/08_Yumemin.md
    media_variants:
      toy_diorama_3d:
        file: characters/character_yumemin_toy_diorama_3d_basic_sheet.png
        prompt: characters/source_prompts/character_yumemin_toy_diorama_3d_basic_sheet.md
        material_reference: ../21_takosan_php_prompt_pun/clip1_start.png
        adopted_design: Candidate A — ぷくもち幼体型
        use_for: 窓際トイジオラマ3D映像での通常形。少し縦につぶれたふっくらしたもち型、低めでやや離れた黒い点目、小さく丸みのある耳、短く柔らかく上向きに反る鼻を固定する。脚・腕・口なし、青い体、白い後部、可動鼻、別小道具の木槌を維持し、21準拠のマットな微細素材感と暖色トイ照明を適用する
  yume_tele_anchor:
    file: characters/character_yume_tele_anchor_basic_sheet.png
    prompt: characters/source_prompts/character_yume_tele_anchor_basic_sheet.md
    canon: 02_CHARACTERS/09_YumeTeleAnchor.md
    face_identity_canon: 02_CHARACTERS/YumeTeleAnchor.png
    use_for: ユーザーが別配役を指定しない「ゆめテレ」のニュース、速報、スタジオ進行。エピソード25と同じ女性アナウンサーの顔、ボブ、紺ジャケット、オフホワイトのブラウスを固定する
    sheet_layout: 同一人物の正面胸上／左3分の4胸上／右3分の4胸上。背景、ロゴ、文字、別人物を含まない

action_prompt:
  design_source_of_truth: prompt/seedance_script_template.md
  paste_ready_source_of_truth: prompt/seedance_prompt_template.txt
  use_for: シーン地理、人物配置、動作原則、秒区間ごとの攻防、カメラ、接触物理、状態連続性
  required_for: 格闘、追跡、破壊、複雑な武器操作、激しいカメラ
  per_contact: 起点、経路、接触点、防御、受力、結果を文章で明記する
  continuity: 各秒区間の入口状態と出口状態を接続し、位置、向き、慣性、傷、破壊、小道具をリセットしない
  default_excluded_inputs: アクション絵コンテ、クレイプレビズ、矢印図、ブロッキング画像、旧失敗動画
  conditional_keyframes: 始終端・複数キーフレーム、グリッド絵コンテ、クレイ／ブロックアウトはSeedance 2.5対応機能だが、ユーザーが明示指定した場合だけ使う

pacing_prompt:
  design_source_of_truth: prompt/seedance_script_template.md
  paste_ready_source_of_truth: prompt/seedance_prompt_template.txt
  workflow: .claude/skills/seedance/references/pacing_overlap_workflow.md
  required_for: 会話、コメディ、リアクション、登場、受け渡し、交換、組み立て、調理、および間延び・待ち・テンポに関するFB対応
  lanes: 音声、主動作、副動作、カメラ
  dependencies: ハード依存、ソフト依存、並行可能、演出上の待ち
  duration_basis: 全イベントの直列合計ではなく、ハード依存だけをつないだクリティカルパスで判断する

key_asset_generation:
  tool: imagegen
  use_for: 画面内で判読・識別させる重要小道具、ロゴ、看板、端末画面を完成画質で個別生成する
  naming: prop_<name>_production.png、logo_<name>_master.png、screen_<name>_production.png
  layout: 1ファイル1アセット。説明パネル、比較案、注釈を同居させない
  audit: 表示文字、禁止語、材質、縁切れ、透かしを原寸で目視する

prompt_template:
  design_file: prompt/seedance_script_template.md
  paste_ready_file: prompt/seedance_prompt_template.txt
  single_generation_output: prompt.txt
  multiple_generation_output: prompt_clip_<id>.txt
  paste_ready_rule: 1回の生成につき1つのプレーンテキストファイル。コードフェンス、Markdown見出し、設計メモ、監査結果を入れず、ファイル全体をそのままSeedanceへ貼り付けられる状態にする
