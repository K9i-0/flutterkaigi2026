name: Madogiwa Studio CI/CD

on:
  pull_request:
    paths:
      - ".github/workflows/madogiwa-studio.yml"
      - "16_MADOGIWA_STUDIO/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/madogiwa-studio.yml"
      - "16_MADOGIWA_STUDIO/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madogiwa-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: 16_MADOGIWA_STUDIO

jobs:
  verify:
    name: Verify Worker and Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 16_MADOGIWA_STUDIO/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  deploy:
    name: Migrate D1 and deploy production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: madogiwa-studio-production
      url: https://madogiwa-studio.madogiwa-studio.workers.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 16_MADOGIWA_STUDIO/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Verify production
        working-directory: .
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 5 --retry-all-errors
          https://madogiwa-studio.madogiwa-studio.workers.dev/api/episodes
          > /dev/null
