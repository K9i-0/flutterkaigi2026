name: yumemi_recruit_exam
description: A landscape tilt-controlled 3D beer catching game.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_scene:
    git:
      url: https://github.com/K9i-0/flutter_scene.git
      ref: 2606511163ea1144b096f3a7d16b8b85ee0dbc2e
      path: packages/flutter_scene
  madogiwa_engine:
    path: ../packages/madogiwa_engine
  vector_math: ^2.4.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.3
  marionette_flutter: ^0.7.0
  hooks: ^2.0.2
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/authors/
    - assets/models/
    - flutter_scene_generated/
